# Render Blueprint: Dashboard -> New -> Blueprint -> pick your GitHub repo.
# Secrets marked sync:false are asked for in the dashboard (see DEPLOYMENT.md).
services:
  - type: web
    name: govdocs-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DB_SSL, value: "true" }
      - { key: MAX_FILE_MB, value: "25" }
      - { key: PUBLIC_API_URL, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: CORS_ORIGIN, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: CLERK_SECRET_KEY, sync: false }
      - { key: ENCRYPTION_KEY, sync: false }
      - { key: AWS_S3_BUCKET, sync: false }
      - { key: AWS_REGION, sync: false }
      - { key: AWS_ACCESS_KEY_ID, sync: false }
      - { key: AWS_SECRET_ACCESS_KEY, sync: false }
      - { key: S3_ENDPOINT, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
  # Optional: host the website on Render too (Vercel is simpler and recommended).
  # - type: web
  #   name: govdocs-web
  #   runtime: node
  #   rootDir: frontend
  #   plan: free
  #   buildCommand: npm install && npm run build
  #   startCommand: npm run start
  #   envVars:
  #     - { key: NEXT_PUBLIC_API_URL, sync: false }
  #     - { key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, sync: false }
  #     - { key: CLERK_SECRET_KEY, sync: false }
