# Fly.io (paid-ish, needs a card). Run inside /backend:  fly launch --no-deploy --copy-config   then   fly secrets set ...   then   fly deploy
app = "govdocs-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DB_SSL = "true"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
